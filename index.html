<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GymLog">
<title>GymLog</title>
<style>
:root{--bg:#000;--card:#131017;--ink:#F2EFF7;--mute:#9D95AD;--acc:#6A35C2;--acc2:#B794F4;--hi:#FFD23F;--line:#2B2535;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0)}
main{max-width:520px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom,0))}
h1,h2,h3{margin:0;font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;font-stretch:condensed;letter-spacing:.3px}
h1{font-size:30px}h3{font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.mute{color:var(--mute);font-size:14px}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.grow{flex:1}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
button{cursor:pointer}.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.num{width:76px;text-align:center}
.set{display:inline-block;background:var(--bg);border-radius:8px;padding:4px 9px;margin:6px 6px 0 0;font-weight:600}
.set a{color:var(--mute);margin-left:4px;cursor:pointer}
.chip{display:inline-flex;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;margin:6px 6px 0 0;font-size:14px}
.chip a{color:var(--mute);cursor:pointer}
.today{border-left:5px solid var(--hi)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 2px;font-size:14px;font-weight:600;color:var(--mute)}
.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1;padding:8px 4px;font-size:14px}.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.ch{width:100%;height:auto;display:block}.ln{fill:none;stroke:var(--acc2);stroke-width:2.5;stroke-linejoin:round}.gl{stroke:var(--line);stroke-width:1}.tx{fill:var(--mute);font-size:10px}.dt{fill:var(--card);stroke:var(--acc2);stroke-width:2}.dl{fill:var(--hi);stroke:var(--acc2);stroke-width:2}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st .card{margin:0}.st b{font-size:22px;display:block}
nav button.on{color:var(--acc2);box-shadow:inset 0 3px 0 var(--acc2)}
</style></head><body>
<main id="app"></main><nav id="nav"></nav>
<script>
const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const def=()=>({machines:["Press de banca","Press inclinado","Jalón al pecho","Remo en polea","Prensa de piernas","Extensión de cuádriceps","Curl femoral","Press militar","Curl de bíceps","Cinta de correr"],
routine:[["Press de banca","Press inclinado"],["Jalón al pecho","Remo en polea"],[],["Prensa de piernas","Extensión de cuádriceps","Curl femoral"],["Press militar","Curl de bíceps"],["Cinta de correr"],[]],logs:[]});
let S;try{S=JSON.parse(localStorage.getItem("gymlog"))}catch(e){}
S=S||def();
const save=()=>{try{localStorage.setItem("gymlog",JSON.stringify(S))}catch(e){}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const key=()=>new Date().toLocaleDateString("sv");
const td=(new Date().getDay()+6)%7;
let v="hoy",cur=[],extra=[],hm="";
const opts=l=>l.map(m=>`<option>${esc(m)}</option>`).join("");

function hoy(){
 const k=key(),done=S.logs.filter(l=>l.d===k).map(l=>l.m);
 cur=[...new Set([...S.routine[td],...extra,...done])];
 const rest=S.machines.filter(m=>!cur.includes(m));
 return nudge()+`<h1>${DAYS[td]}</h1><p class="mute">${S.routine[td].length?"Tu rutina de hoy":"Hoy no tienes máquinas asignadas"}</p>`+
 (cur.length?cur.map((m,i)=>{
  const mine=S.logs.filter(l=>l.d===k&&l.m===m),p=[...S.logs].reverse().find(l=>l.m===m&&l.d!==k);
  return `<div class="card"><div class="row sp"><h3>${esc(m)}</h3><span class="mute">${p?`Última: ${p.kg} kg × ${p.r}`:"Sin historial"}</span></div>
  <div>${mine.map(l=>`<span class="set">${l.kg} kg × ${l.r}<a onclick="delSet(${S.logs.indexOf(l)})">✕</a></span>`).join("")}</div>
  <div class="row" style="margin-top:8px"><input class="num" id="kg${i}" type="number" inputmode="decimal" placeholder="kg" value="${mine.length?mine[mine.length-1].kg:p?p.kg:""}"><input class="num" id="r${i}" type="number" inputmode="numeric" placeholder="reps" value="${mine.length?mine[mine.length-1].r:p?p.r:""}"><button class="pri grow" onclick="addSet(${i})">Añadir serie</button></div></div>`}).join("")
  :`<div class="card mute">Día de descanso. Puedes asignar máquinas en Rutina o añadir una ahora.</div>`)+
 (rest.length?`<div class="card row"><select class="grow" id="ex">${opts(rest)}</select><button onclick="addEx()">Añadir a hoy</button></div>`:"");
}
function rutina(){
 return `<h1>Rutina semanal</h1><p class="mute">Elige qué máquinas haces cada día.</p>`+DAYS.map((d,i)=>{
  const rest=S.machines.filter(m=>!S.routine[i].includes(m));
  return `<div class="card ${i===td?"today":""}"><h3>${d}</h3><div>${S.routine[i].length?S.routine[i].map((m,j)=>`<span class="chip">${esc(m)}<a onclick="delR(${i},${j})">✕</a></span>`).join(""):`<span class="mute">Descanso</span>`}</div>
  ${rest.length?`<div class="row" style="margin-top:10px"><select class="grow" id="rs${i}">${opts(rest)}</select><button onclick="addR(${i})">Añadir</button></div>`:""}</div>`}).join("");
}
function maquinas(){
 return `<h1>Máquinas</h1>`+bk()+`<div class="card row"><input class="grow" id="nm" placeholder="Nueva máquina o ejercicio" onkeydown="if(event.key==='Enter')addM()"><button class="pri" onclick="addM()">Añadir</button></div>`+
 S.machines.map((m,i)=>`<div class="card row sp"><span>${esc(m)}</span><span><button onclick="renM(${i})">Renombrar</button> <button onclick="delM(${i})">Borrar</button></span></div>`).join("");
}
function historial(){
 if(!hm||!S.machines.includes(hm))hm=S.machines[0]||"";
 const L=S.logs.filter(l=>l.m===hm),days={};
 L.forEach(l=>(days[l.d]=days[l.d]||[]).push(l));
 const ds=Object.keys(days).sort().reverse(),best=L.reduce((a,l)=>Math.max(a,l.kg),0);
 return `<h1>Historial</h1><div class="card"><select id="hs" style="width:100%" onchange="hm=this.value;render()">${S.machines.map(m=>`<option ${m===hm?"selected":""}>${esc(m)}</option>`).join("")}</select>
 ${L.length?`<p class="mute">Mejor peso: <b>${best} kg</b> · ${ds.length} sesiones</p>`:""}</div>`+
 (ds.length?ds.map(d=>`<div class="card"><div class="mute">${new Date(d+"T12:00").toLocaleDateString("es",{weekday:"long",day:"numeric",month:"short"})}</div>${days[d].map(l=>`<span class="set">${l.kg} kg × ${l.r}</span>`).join("")}</div>`).join(""):`<div class="card mute">Todavía no hay series de esta máquina.</div>`);
}
let pm="",met="kg";
function progreso(){
 const ms=S.machines.filter(m=>S.logs.some(l=>l.m===m));
 if(!ms.length)return `<h1>Progreso</h1><div class="card mute">Registra series en Hoy y aquí verás cómo evolucionas en cada máquina.</div>`;
 if(!ms.includes(pm))pm=ms[0];
 const by={};S.logs.filter(l=>l.m===pm).forEach(l=>(by[l.d]=by[l.d]||[]).push(l));
 const ds=Object.keys(by).sort();
 const F={kg:a=>Math.max(...a.map(l=>l.kg)),vol:a=>a.reduce((s,l)=>s+l.kg*l.r,0),rm:a=>Math.max(...a.map(l=>l.kg*(1+l.r/30)))};
 const P=ds.map(d=>({d,y:Math.round(F[met](by[d])*10)/10}));
 const W=320,H=190,L=40,R=12,T=14,B=26,ys=P.map(p=>p.y);
 let lo=Math.min(...ys),hi=Math.max(...ys);if(hi===lo){lo=Math.max(0,lo-5);hi+=5}
 const pad=(hi-lo)*.1;lo=Math.max(0,lo-pad);hi+=pad;
 const X=i=>P.length===1?(L+W-R)/2:L+i*(W-L-R)/(P.length-1),Y=y=>T+(hi-y)*(H-T-B)/(hi-lo);
 const fd=d=>d.slice(8)+"/"+d.slice(5,7);
 let g="";for(let k=0;k<4;k++){const y=lo+(hi-lo)*k/3,yy=Y(y);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="tx" x="${L-6}" y="${yy+3}" text-anchor="end">${Math.round(y)}</text>`}
 const line=P.length>1?`<polyline class="ln" points="${P.map((p,i)=>X(i)+","+Y(p.y)).join(" ")}"/>`:"";
 const dots=P.map((p,i)=>`<circle class="${i===P.length-1?"dl":"dt"}" cx="${X(i)}" cy="${Y(p.y)}" r="4"/>`).join("");
 const xl=`<text class="tx" x="${X(0)}" y="${H-8}" text-anchor="${P.length>1?"start":"middle"}">${fd(P[0].d)}</text>`+(P.length>1?`<text class="tx" x="${X(P.length-1)}" y="${H-8}" text-anchor="end">${fd(P[P.length-1].d)}</text>`:"");
 const first=P[0].y,last=P[P.length-1].y,diff=Math.round((last-first)*10)/10,pct=first?Math.round((last-first)/first*100):0;
 const best=Math.max(...S.logs.filter(l=>l.m===pm).map(l=>l.kg));
 const lab={kg:"Mejor peso por sesión",vol:"Volumen por sesión (kg × reps)",rm:"1RM estimado (fórmula Epley)"}[met];
 return `<h1>Progreso</h1><div class="card"><select id="ps" style="width:100%" onchange="pm=this.value;render()">${ms.map(m=>`<option ${m===pm?"selected":""}>${esc(m)}</option>`).join("")}</select>
 <div class="seg">${[["kg","Peso"],["vol","Volumen"],["rm","1RM"]].map(([k,l])=>`<button class="${met===k?"on":""}" onclick="met='${k}';render()">${l}</button>`).join("")}</div>
 <div class="mute">${lab}</div><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de progreso de ${esc(pm)}">${g}${line}${dots}${xl}</svg></div>
 <div class="st"><div class="card"><span class="mute">Cambio</span><b>${diff>0?"+":""}${diff} kg</b><span class="mute">${P.length>1?(pct>0?"+":"")+pct+"% desde el inicio":"Necesitas 2 sesiones"}</span></div>
 <div class="card"><span class="mute">Mejor peso</span><b>${best} kg</b><span class="mute">${ds.length} sesiones</span></div></div>`;
}
function render(){
 $("#app").innerHTML={hoy,rutina,maquinas,progreso,historial}[v]();
 $("#nav").innerHTML=[["hoy","Hoy"],["rutina","Rutina"],["maquinas","Máquinas"],["progreso","Progreso"],["historial","Historial"]].map(([k,l])=>`<button class="${v===k?"on":""}" onclick="v='${k}';render();scrollTo(0,0)">${l}</button>`).join("");
}
function addSet(i){const kg=parseFloat($("#kg"+i).value),r=parseInt($("#r"+i).value);
 if(isNaN(kg)||isNaN(r)){alert("Indica peso y repeticiones.");return}
 S.logs.push({d:key(),m:cur[i],kg,r});save();render()}
function delSet(i){S.logs.splice(i,1);save();render()}
function addEx(){extra.push($("#ex").value);render()}
function addR(i){const m=$("#rs"+i).value;S.routine[i].push(m);save();render()}
function delR(i,j){S.routine[i].splice(j,1);save();render()}
function addM(){const n=$("#nm").value.trim();if(!n||S.machines.includes(n))return;S.machines.push(n);save();render()}
function delM(i){const m=S.machines[i];if(!confirm("¿Borrar "+m+"? Su historial se conserva.")) return;
 S.machines.splice(i,1);S.routine=S.routine.map(r=>r.filter(x=>x!==m));save();render()}
function renM(i){const o=S.machines[i],n=(prompt("Nuevo nombre",o)||"").trim();if(!n||n===o||S.machines.includes(n))return;
 S.machines[i]=n;S.routine=S.routine.map(r=>r.map(x=>x===o?n:x));S.logs.forEach(l=>{if(l.m===o)l.m=n});save();render()}
function ago(){if(!S.lastBackup)return "Aún no has hecho ninguna copia";const n=Math.floor((Date.now()-S.lastBackup)/864e5);return "Última copia: "+(n<=0?"hoy":n===1?"ayer":"hace "+n+" días")}
function nudge(){if(S.logs.length<5||(S.lastBackup&&Date.now()-S.lastBackup<7*864e5))return "";
 return `<div class="card row sp today"><span class="mute">${ago()}</span><button class="pri" onclick="exp()">Guardar copia</button></div>`}
function bk(){return `<div class="card"><h3>Copia de seguridad</h3><p class="mute">${ago()}. Tus datos solo están en este móvil. Guarda una copia en Archivos, iCloud, WhatsApp o el correo.</p>
 <button class="pri" style="width:100%" onclick="exp()">Guardar copia</button>
 <div class="row" style="margin-top:8px"><button class="grow" onclick="cpy()">Copiar texto</button><button class="grow" onclick="pas()">Pegar texto</button></div>
 <label class="row" style="margin-top:8px"><span class="mute">Restaurar archivo</span><input class="grow" type="file" accept=".json,application/json" onchange="imp(this)"></label></div>`}
function mark(){S.lastBackup=Date.now();save();render()}
async function exp(){const name="gymlog-"+key()+".json",txt=JSON.stringify(S);
 try{const f=new File([txt],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Copia GymLog"});mark();return}}catch(e){if(e&&e.name==="AbortError")return}
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=name;a.click();mark()}
async function cpy(){try{await navigator.clipboard.writeText(JSON.stringify(S));mark();alert("Copiado. Pégalo en una nota o en un mensaje a ti mismo.")}catch(e){alert("No se pudo copiar. Usa Guardar copia.")}}
function pas(){const t=prompt("Pega aquí el texto de tu copia");if(t)load(t)}
function load(t){try{const d=JSON.parse(t);if(!d.machines||!d.routine||!d.logs)throw 0;if(!confirm("Esto reemplaza tus datos actuales. ¿Continuar?"))return;S=d;save();render();alert("Datos restaurados")}catch(e){alert("La copia no es válida")}}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(f);el.value=""}
render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
