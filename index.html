<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GymLog">
<title>GymLog</title>
<style>
:root{--bg:#000;--card:#131017;--ink:#F2EFF7;--mute:#9D95AD;--acc:#6A35C2;--acc2:#B794F4;--hi:#FFD23F;--line:#2B2535;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0)}
main{max-width:520px;margin:0 auto;padding:16px 16px calc(90px + env(safe-area-inset-bottom,0))}
h1,h2,h3{margin:0;font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif;font-stretch:condensed;letter-spacing:.3px}
h1{font-size:30px}h3{font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0}
.mute{color:var(--mute);font-size:14px}.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.grow{flex:1}
input,select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc2);outline-offset:1px}
button{cursor:pointer}.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.num{width:76px;text-align:center}
.set{display:inline-block;background:var(--bg);border-radius:8px;padding:4px 9px;margin:6px 6px 0 0;font-weight:600}
.set a{color:var(--mute);margin-left:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:28px;min-height:28px;border-radius:6px}.set a:focus-visible{outline:2px solid var(--acc2)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;margin:6px 6px 0 0;font-size:14px}
.chip a{color:var(--mute);cursor:pointer}
.ico{flex:none;fill:none;stroke:var(--acc2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.ico .e{stroke:var(--mute)}
.ib{border:0;background:none;padding:0;cursor:pointer;display:flex;flex:none}.lk{color:var(--acc2);font-size:14px;cursor:pointer}
#mo{position:fixed;inset:0;background:rgba(0,0,0,.82);display:grid;place-items:center;padding:16px;z-index:9}#mo .card{width:100%;max-width:360px;text-align:center}#mo p{text-align:left;color:var(--mute);font-size:15px}.big{width:min(260px,70vw);height:auto;stroke-width:2}
.today{border-left:5px solid var(--hi)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 2px;font-size:14px;font-weight:600;color:var(--mute)}
.seg{display:flex;gap:6px;margin:10px 0}.seg button{flex:1;padding:8px 4px;font-size:14px}.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.ch{width:100%;height:auto;display:block}.ln{fill:none;stroke:var(--acc2);stroke-width:2.5;stroke-linejoin:round}.gl{stroke:var(--line);stroke-width:1}.tx{fill:var(--mute);font-size:10px}.dt{fill:var(--card);stroke:var(--acc2);stroke-width:2}.dl{fill:var(--hi);stroke:var(--acc2);stroke-width:2}
.st{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st .card{margin:0}.st b{font-size:22px;display:block}
nav button.on{color:var(--acc2);box-shadow:inset 0 3px 0 var(--acc2)}
</style></head><body>
<main id="app"></main><nav id="nav"></nav>
<script>
const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const def=()=>({machines:["Press de banca","Press inclinado","Jalón al pecho","Remo en polea","Prensa de piernas","Extensión de cuádriceps","Curl femoral","Press militar","Curl de bíceps","Cinta de correr"],
routine:[["Press de banca","Press inclinado"],["Jalón al pecho","Remo en polea"],[],["Prensa de piernas","Extensión de cuádriceps","Curl femoral"],["Press militar","Curl de bíceps"],["Cinta de correr"],[]],logs:[]});
let S;try{S=JSON.parse(localStorage.getItem("gymlog"))}catch(e){}
const drafts={};
function normalizeState(raw){
 const base=def(), d=raw&&typeof raw==="object"?raw:{};
 const machines=Array.isArray(d.machines)?d.machines.filter(x=>typeof x==="string"&&x.trim()).map(x=>x.trim()):base.machines;
 const routine=Array.from({length:7},(_,i)=>Array.isArray(d.routine?.[i])?d.routine[i].filter(x=>typeof x==="string"&&machines.includes(x)):[]);
 const logs=Array.isArray(d.logs)?d.logs.filter(l=>l&&typeof l==="object"&&typeof l.d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(l.d)&&typeof l.m==="string"&&l.m.trim()&&Number.isFinite(Number(l.kg))&&Number(l.kg)>=0&&Number.isInteger(Number(l.r))&&Number(l.r)>0).map(l=>({d:l.d,m:l.m.trim(),kg:Number(l.kg),r:Number(l.r)})):[];
 // Include deleted-machine names in history; their records must remain reachable.
 return {machines:[...new Set(machines)],routine,logs,lastBackup:Number.isFinite(d.lastBackup)?d.lastBackup:null};
}
S=normalizeState(S||def());
const save=()=>{try{localStorage.setItem("gymlog",JSON.stringify(S));return true}catch(e){alert("No se han podido guardar los datos. Puede que el almacenamiento esté lleno o bloqueado. Exporta una copia si todavía puedes.");return false}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const key=()=>new Date().toLocaleDateString("sv");
const td=(new Date().getDay()+6)%7;
let v="hoy",cur=[],extra=[],hm="";
const opts=l=>l.map(m=>`<option>${esc(m)}</option>`).join("");

const IC={
ban:'<path class="e" d="M10 44H50M16 44V56M44 44V56M12 16H36M12 13V19M36 13V19"/><circle cx="12" cy="37" r="4"/><path d="M17 39H42L50 46V56M24 39V16"/>',
inc:'<path class="e" d="M14 38L33 52H48M26 14H44"/><circle cx="14" cy="28" r="4"/><path d="M18 32L36 45H46L48 57M24 37L35 14"/>',
jal:'<path class="e" d="M32 3V13M16 13H48M24 46H44"/><circle cx="32" cy="22" r="4"/><path d="M32 27V44H42V58M32 30L20 13M32 30L44 13"/>',
rem:'<path class="e" d="M46 36H60M20 46H34"/><circle cx="26" cy="18" r="4"/><path d="M27 23L26 42H40L46 50M27 28L36 36H46"/>',
pre:'<path class="e" d="M6 56H58M52 22V50"/><circle cx="10" cy="46" r="4"/><path d="M14 44L28 36L40 24L50 34"/>',
ext:'<path class="e" d="M20 12V46M20 46H44M51 25L57 31"/><circle cx="26" cy="14" r="4"/><path d="M26 19V40H42L54 28M26 24L33 33"/>',
fem:'<path class="e" d="M6 42H50M12 42V54M44 42V54M44 20H52"/><circle cx="10" cy="35" r="4"/><path d="M15 37H48V20"/>',
mil:'<path class="e" d="M24 46H46M20 8H44"/><circle cx="32" cy="22" r="4"/><path d="M32 27V44H42V58M32 31L24 22V8M32 31L40 22V8"/>',
cur:'<path class="e" stroke-width="6" d="M43 25L49 19"/><circle cx="30" cy="10" r="4"/><path d="M30 15V38M30 38L24 58M30 38L36 58M30 19L34 32L44 23"/>',
cin:'<path class="e" d="M6 58H50M54 58V30H44"/><circle cx="26" cy="12" r="4"/><path d="M27 17L31 34M28 21L38 26L34 31M31 34L41 42L35 53M31 34L21 43L12 50"/>',
gen:'<path class="e" d="M18 32H46"/><path d="M12 24V40M18 20V44M52 24V40M46 20V44"/>'};
function icKey(n){const s=n.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
 const t=[["inclin","inc"],["banca|press plano","ban"],["jalon|dominada|polea alta","jal"],["remo","rem"],["prensa|sentadilla|hack","pre"],["extension|cuadriceps","ext"],["femoral|isquio|curl de pierna","fem"],["militar|hombro|elevacion","mil"],["curl|biceps","cur"],["cinta|correr|carrera|eliptica|cardio","cin"]];
 for(const [r,k] of t)if(new RegExp(r).test(s))return k;return "gen"}
const ico=(n,z=40)=>`<svg class="ico" viewBox="0 0 64 64" width="${z}" height="${z}" aria-hidden="true">${IC[icKey(n)]}</svg>`;
const mv=(L,dx,dy)=>L.map(l=>[l,l.map((v,i)=>v+(i%2?dy:dx))]);
const AN={
ban:{s:"M10 44H50M16 44V56M44 44V56",h:[12,37],b:[[[17,39,42,39,50,46,50,56],[17,39,42,39,50,46,50,56]],[[24,39,31,34,24,29],[24,39,24,28,24,16]]],e:mv([[14,29,34,29],[14,26,14,32],[34,26,34,32]],0,-13)},
inc:{s:"M14 38L33 52H48",h:[14,28],b:[[[18,32,36,45,46,45,48,57],[18,32,36,45,46,45,48,57]],[[24,37,32,35,27,29],[24,37,30,25,35,14]]],e:mv([[19,29,35,29]],8,-15)},
jal:{s:"M24 46H44",h:[32,22],b:[[[32,27,32,44,42,44,42,58],[32,27,32,44,42,44,42,58]],[[32,30,26,21.5,20,13],[32,30,24,36,20,26]],[[32,30,38,21.5,44,13],[32,30,40,36,44,26]]],e:mv([[16,13,48,13]],0,13).concat([[[32,3,32,13],[32,3,32,26]]])},
rem:{s:"M20 46H34",h:[26,18],b:[[[27,23,26,42,40,42,46,50],[27,23,26,42,40,42,46,50]],[[27,28,36,35,46,36],[27,28,24,37,35,35]]],e:[[[46,36,60,36],[35,35,60,36]]]},
pre:{s:"M6 56H58",h:[10,47],b:[[[14,45,26,40],[14,45,26,40]],[[26,40,32,28,42,32],[26,40,39,32,52,24]]],e:mv([[38,25,46,39]],10,-8)},
ext:{s:"M20 12V46M20 46H44",h:[26,14],b:[[[26,19,26,40,42,40],[26,19,26,40,42,40]],[[26,24,33,33],[26,24,33,33]],[[42,40,44,56],[42,40,54,28]]],e:[[[40,54,48,54],[51,25,57,31]]]},
fem:{s:"M6 42H50M12 42V54M44 42V54",h:[10,35],b:[[[15,37,48,37],[15,37,48,37]],[[48,37,58,37],[48,37,48,20]]],e:[[[58,34,58,40],[44,20,52,20]]]},
mil:{s:"M24 46H46",h:[32,22],b:[[[32,27,32,44,42,44,42,58],[32,27,32,44,42,44,42,58]],[[32,31,22,30,24,22],[32,31,24,20,24,8]],[[32,31,42,30,40,22],[32,31,40,20,40,8]]],e:mv([[20,22,44,22]],0,-14)},
cur:{s:"",w:1,h:[30,10],b:[[[30,15,30,38],[30,15,30,38]],[[24,58,30,38,36,58],[24,58,30,38,36,58]],[[30,19,31,29,32,38],[30,19,34,32,44,23]]],e:[[[31,41,34,38],[43,25,49,19]]]},
cin:{s:"M6 58H50M54 58V30H44",h:[26,12],b:[[[27,17,31,34],[27,17,31,34]],[[28,21,38,26,34,31],[28,21,20,28,26,33]],[[31,34,41,42,35,53],[31,34,21,43,12,50]],[[31,34,21,43,12,50],[31,34,41,42,35,53]]],e:[]},
gen:{s:"",h:null,b:[],e:mv([[18,44,46,44],[12,36,12,52],[18,32,18,56],[52,36,52,52],[46,32,46,56]],0,-20)}};
const TIP={
ban:"Baja la barra al pecho con control y empuja hacia arriba sin bloquear los codos. Espalda apoyada en el banco.",
inc:"Como el press de banca, pero el empuje va hacia arriba y un poco adelante. Codos a unos 45° del cuerpo.",
jal:"Saca el pecho y tira de la barra hacia la parte alta del pecho, llevando los codos hacia abajo. No balancees el torso.",
rem:"Espalda recta. Tira del agarre hacia el abdomen juntando los omóplatos y vuelve despacio sin encorvarte.",
pre:"Pies a la anchura de los hombros. Baja hasta unos 90° en la rodilla y empuja sin despegar la zona lumbar del respaldo.",
ext:"Estira la pierna del todo apretando el cuádriceps y baja despacio. Sin impulso.",
fem:"Lleva los talones hacia los glúteos sin levantar la cadera del banco y baja de forma controlada.",
mil:"Empuja sobre la cabeza sin arquear la espalda y baja hasta la altura de las orejas.",
cur:"Codos pegados al cuerpo. Sube la mancuerna sin balancearte y baja despacio.",
cin:"Torso erguido y mirada al frente. Apoya el pie bajo tu cuerpo y mantén los brazos a 90°, relajados.",
gen:"Movimiento controlado: sube con fuerza y baja despacio, sin impulso. Si dudas de la técnica, pide ayuda a un monitor."};
const dstr=a=>{let s="";for(let i=0;i<a.length;i+=2)s+=(i?"L":"M")+a[i].toFixed(1)+" "+a[i+1].toFixed(1);return s};
const lerp=(a,b,p)=>a.map((v,i)=>v+(b[i]-v)*p);
const frameD=(a,p)=>[...a.e,...a.b].map(([A,B])=>dstr(lerp(A,B,p)));
let raf=0,play=true,ph=0,last=0;
function demo(n){
 closeDemo();const k=icKey(n),a=AN[k],w=a.w?' stroke-width="6"':"";
 const mo=document.createElement("div");mo.id="mo";mo.onclick=e=>{if(e.target===mo)closeDemo()};
 mo.innerHTML=`<div class="card" role="dialog" aria-label="Cómo se hace ${esc(n)}"><h3>${esc(n)}</h3><svg class="ico big" viewBox="0 0 64 64" role="img" aria-label="Animación del ejercicio"><path class="e" d="${a.s}"/>${a.e.map(()=>`<path class="e"${w}/>`).join("")}${a.b.map(()=>"<path/>").join("")}${a.h?`<circle cx="${a.h[0]}" cy="${a.h[1]}" r="4"/>`:""}</svg><p>${TIP[k]}</p><div class="row"><button class="grow" id="pp" onclick="togglePlay()">Pausar</button><button class="pri grow" onclick="closeDemo()">Cerrar</button></div></div>`;
 document.body.appendChild(mo);
 const P=[...mo.querySelectorAll("svg path")].slice(1);
 play=!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);ph=0;last=performance.now();
 if(!play)mo.querySelector("#pp").textContent="Reproducir";
 const tick=now=>{if(!document.getElementById("mo"))return;if(play)ph=(ph+now-last)%3000;last=now;
  const d=frameD(a,0.5-0.5*Math.cos(2*Math.PI*ph/3000));P.forEach((el,i)=>el.setAttribute("d",d[i]));raf=requestAnimationFrame(tick)};
 raf=requestAnimationFrame(tick)}
function togglePlay(){play=!play;document.getElementById("pp").textContent=play?"Pausar":"Reproducir"}
function closeDemo(){cancelAnimationFrame(raf);const m=document.getElementById("mo");if(m)m.remove()}
addEventListener("keydown",e=>{if(e.key==="Escape")closeDemo()});
function hoy(){
 const k=key(),done=S.logs.filter(l=>l.d===k).map(l=>l.m);
 cur=[...new Set([...S.routine[td],...extra,...done])];
 const rest=S.machines.filter(m=>!cur.includes(m));
 return nudge()+`<h1>${DAYS[td]}</h1><p class="mute">${S.routine[td].length?"Tu rutina de hoy":"Hoy no tienes máquinas asignadas"}</p>`+
 (cur.length?cur.map((m,i)=>{
  const mine=S.logs.filter(l=>l.d===k&&l.m===m),p=[...S.logs].reverse().find(l=>l.m===m&&l.d!==k);
  return `<div class="card"><div class="row"><button class="ib" onclick="demo(cur[${i}])" aria-label="Ver cómo se hace">${ico(m,44)}</button><div class="grow"><h3>${esc(m)}</h3><span class="mute">${p?`Última: ${p.kg} kg × ${p.r}`:"Sin historial"}</span><div><a class="lk" onclick="demo(cur[${i}])">▶ Cómo se hace</a></div></div></div>
  <div>${mine.map(l=>`<span class="set">${l.kg} kg × ${l.r}<button class="ib" style="min-width:28px;min-height:28px;justify-content:center" aria-label="Borrar serie de ${esc(m)}" onclick="delSet(${S.logs.indexOf(l)})">✕</button></span>`).join("")}</div>
  <div class="row" style="margin-top:8px"><input class="num" id="kg${i}" type="text" inputmode="decimal" autocomplete="off" placeholder="kg" aria-label="Peso en kg" value="${esc(drafts["kg"+i]??(mine.length?mine[mine.length-1].kg:p?p.kg:""))}" oninput="drafts['kg${i}']=this.value"><input class="num" id="r${i}" type="text" inputmode="numeric" autocomplete="off" placeholder="reps" aria-label="Repeticiones" value="${esc(drafts["r"+i]??(mine.length?mine[mine.length-1].r:p?p.r:""))}" oninput="drafts['r${i}']=this.value"><button class="pri grow" onclick="addSet(${i})">Añadir serie</button></div></div>`}).join("")
  :`<div class="card mute">Día de descanso. Puedes asignar máquinas en Rutina o añadir una ahora.</div>`)+
 (rest.length?`<div class="card row"><select class="grow" id="ex">${opts(rest)}</select><button onclick="addEx()">Añadir a hoy</button></div>`:"");
}
function rutina(){
 return `<h1>Rutina semanal</h1><p class="mute">Elige qué máquinas haces cada día.</p>`+DAYS.map((d,i)=>{
  const rest=S.machines.filter(m=>!S.routine[i].includes(m));
  return `<div class="card ${i===td?"today":""}"><h3>${d}</h3><div>${S.routine[i].length?S.routine[i].map((m,j)=>`<span class="chip">${ico(m,20)}${esc(m)}<a onclick="delR(${i},${j})">✕</a></span>`).join(""):`<span class="mute">Descanso</span>`}</div>
  ${rest.length?`<div class="row" style="margin-top:10px"><select class="grow" id="rs${i}">${opts(rest)}</select><button onclick="addR(${i})">Añadir</button></div>`:""}</div>`}).join("");
}
function maquinas(){
 return `<h1>Máquinas</h1>`+bk()+`<div class="card row"><input class="grow" id="nm" placeholder="Nueva máquina o ejercicio" onkeydown="if(event.key==='Enter')addM()"><button class="pri" onclick="addM()">Añadir</button></div>`+
 S.machines.map((m,i)=>`<div class="card row sp"><span class="row"><button class="ib" onclick="demo(S.machines[${i}])" aria-label="Ver cómo se hace">${ico(m,32)}</button>${esc(m)}</span><span><button onclick="renM(${i})">Renombrar</button> <button onclick="delM(${i})">Borrar</button></span></div>`).join("");
}
function historial(){
 const names=[...new Set([...S.machines,...S.logs.map(l=>l.m)])];
 if(!hm||!names.includes(hm))hm=names[0]||"";
 const L=S.logs.filter(l=>l.m===hm),days={};
 L.forEach(l=>(days[l.d]=days[l.d]||[]).push(l));
 const ds=Object.keys(days).sort().reverse(),best=L.reduce((a,l)=>Math.max(a,l.kg),0);
 return `<h1>Historial</h1><div class="card"><select id="hs" style="width:100%" onchange="hm=this.value;render()">${names.map(m=>`<option value="${esc(m)}" ${m===hm?"selected":""}>${esc(m)}${S.machines.includes(m)?"":" (borrada)"}</option>`).join("")}</select>
 ${L.length?`<p class="mute">Mejor peso: <b>${best} kg</b> · ${ds.length} sesiones</p>`:""}</div>`+
 (ds.length?ds.map(d=>`<div class="card"><div class="mute">${new Date(d+"T12:00").toLocaleDateString("es",{weekday:"long",day:"numeric",month:"short"})}</div>${days[d].map(l=>`<span class="set">${l.kg} kg × ${l.r}</span>`).join("")}</div>`).join(""):`<div class="card mute">Todavía no hay series de esta máquina.</div>`);
}
let pm="",met="kg";
function progreso(){
 const ms=[...new Set(S.logs.map(l=>l.m))];
 if(!ms.length)return `<h1>Progreso</h1><div class="card mute">Registra series en Hoy y aquí verás cómo evolucionas en cada máquina.</div>`;
 if(!ms.includes(pm))pm=ms[0];
 const by={};S.logs.filter(l=>l.m===pm).forEach(l=>(by[l.d]=by[l.d]||[]).push(l));
 const ds=Object.keys(by).sort();
 const F={kg:a=>Math.max(...a.map(l=>l.kg)),vol:a=>a.reduce((s,l)=>s+l.kg*l.r,0),rm:a=>Math.max(...a.map(l=>l.kg*(1+l.r/30)))};
 const P=ds.map(d=>({d,y:Math.round(F[met](by[d])*10)/10}));
 const W=320,H=190,L=40,R=12,T=14,B=26,ys=P.map(p=>p.y);
 let lo=Math.min(...ys),hi=Math.max(...ys);if(hi===lo){lo=Math.max(0,lo-5);hi+=5}
 const pad=(hi-lo)*.1;lo=Math.max(0,lo-pad);hi+=pad;
 const X=i=>P.length===1?(L+W-R)/2:L+i*(W-L-R)/(P.length-1),Y=y=>T+(hi-y)*(H-T-B)/(hi-lo);
 const fd=d=>d.slice(8)+"/"+d.slice(5,7);
 let g="";for(let k=0;k<4;k++){const y=lo+(hi-lo)*k/3,yy=Y(y);g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="tx" x="${L-6}" y="${yy+3}" text-anchor="end">${Math.round(y)}</text>`}
 const line=P.length>1?`<polyline class="ln" points="${P.map((p,i)=>X(i)+","+Y(p.y)).join(" ")}"/>`:"";
 const dots=P.map((p,i)=>`<circle class="${i===P.length-1?"dl":"dt"}" cx="${X(i)}" cy="${Y(p.y)}" r="4"/>`).join("");
 const xl=`<text class="tx" x="${X(0)}" y="${H-8}" text-anchor="${P.length>1?"start":"middle"}">${fd(P[0].d)}</text>`+(P.length>1?`<text class="tx" x="${X(P.length-1)}" y="${H-8}" text-anchor="end">${fd(P[P.length-1].d)}</text>`:"");
 const first=P[0].y,last=P[P.length-1].y,diff=Math.round((last-first)*10)/10,pct=first?Math.round((last-first)/first*100):0;
 const best=Math.max(...S.logs.filter(l=>l.m===pm).map(l=>l.kg));
 const lab={kg:"Mejor peso por sesión",vol:"Volumen por sesión (kg × reps)",rm:"1RM estimado (fórmula Epley)"}[met];
 return `<h1>Progreso</h1><div class="card"><select id="ps" style="width:100%" onchange="pm=this.value;render()">${ms.map(m=>`<option ${m===pm?"selected":""}>${esc(m)}</option>`).join("")}</select>
 <div class="seg">${[["kg","Peso"],["vol","Volumen"],["rm","1RM"]].map(([k,l])=>`<button class="${met===k?"on":""}" onclick="met='${k}';render()">${l}</button>`).join("")}</div>
 <div class="mute">${lab}</div><svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica de progreso de ${esc(pm)}">${g}${line}${dots}${xl}</svg></div>
 <div class="st"><div class="card"><span class="mute">Cambio</span><b>${diff>0?"+":""}${diff} kg</b><span class="mute">${P.length>1?(pct>0?"+":"")+pct+"% desde el inicio":"Necesitas 2 sesiones"}</span></div>
 <div class="card"><span class="mute">Mejor peso</span><b>${best} kg</b><span class="mute">${ds.length} sesiones</span></div></div>`;
}
function render(){
 $("#app").innerHTML={hoy,rutina,maquinas,progreso,historial}[v]();
 $("#nav").innerHTML=[["hoy","Hoy"],["rutina","Rutina"],["maquinas","Máquinas"],["progreso","Progreso"],["historial","Historial"]].map(([k,l])=>`<button class="${v===k?"on":""}" onclick="v='${k}';render();scrollTo(0,0)">${l}</button>`).join("");
}
function parseDecimal(raw){const t=String(raw??"").trim().replace(/\s/g,"").replace(",",".");if(!t||!/^(?:\d+(?:\.\d+)?|\.\d+)$/.test(t))return NaN;return Number(t)}
function addSet(i){const kg=parseDecimal($("#kg"+i).value),rText=$("#r"+i).value.trim(),r=Number(rText);
 if(!Number.isFinite(kg)||kg<0){alert("El peso debe ser un número igual o mayor que 0. Puedes usar coma o punto decimal.");return}
 if(!/^\d+$/.test(rText)||!Number.isSafeInteger(r)||r<=0){alert("Las repeticiones deben ser un número entero mayor que 0.");return}
 S.logs.push({d:key(),m:cur[i],kg,r});delete drafts["kg"+i];delete drafts["r"+i];save();render()}
function delSet(i){if(!Number.isInteger(i)||!S.logs[i])return;if(!confirm("¿Quieres borrar esta serie?"))return;S.logs.splice(i,1);save();render()}
function addEx(){extra.push($("#ex").value);render()}
function addR(i){const m=$("#rs"+i).value;S.routine[i].push(m);save();render()}
function delR(i,j){S.routine[i].splice(j,1);save();render()}
function addM(){const n=$("#nm").value.trim();if(!n||S.machines.includes(n))return;S.machines.push(n);save();render()}
function delM(i){const m=S.machines[i];if(!confirm("¿Borrar "+m+"? Su historial se conserva.")) return;
 S.machines.splice(i,1);S.routine=S.routine.map(r=>r.filter(x=>x!==m));save();render()}
function renM(i){const o=S.machines[i],n=(prompt("Nuevo nombre",o)||"").trim();if(!n||n===o||S.machines.includes(n))return;
 S.machines[i]=n;S.routine=S.routine.map(r=>r.map(x=>x===o?n:x));S.logs.forEach(l=>{if(l.m===o)l.m=n});save();render()}
function ago(){if(!S.lastBackup)return "Aún no has hecho ninguna copia";const n=Math.floor((Date.now()-S.lastBackup)/864e5);return "Última copia: "+(n<=0?"hoy":n===1?"ayer":"hace "+n+" días")}
function nudge(){if(S.logs.length<5||(S.lastBackup&&Date.now()-S.lastBackup<7*864e5))return "";
 return `<div class="card row sp today"><span class="mute">${ago()}</span><button class="pri" onclick="exp()">Guardar copia</button></div>`}
function bk(){return `<div class="card"><h3>Copia de seguridad</h3><p class="mute">${ago()}. Tus datos solo están en este móvil. Guarda una copia en Archivos, iCloud, WhatsApp o el correo.</p>
 <button class="pri" style="width:100%" onclick="exp()">Guardar copia</button>
 <div class="row" style="margin-top:8px"><button class="grow" onclick="cpy()">Copiar texto</button><button class="grow" onclick="pas()">Pegar texto</button></div>
 <label class="row" style="margin-top:8px"><span class="mute">Restaurar archivo</span><input class="grow" type="file" accept=".json,application/json" onchange="imp(this)"></label></div>`}
function mark(){S.lastBackup=Date.now();save();render()}
async function exp(){const name="gymlog-"+key()+".json",txt=JSON.stringify(S);
 try{
  const cap=window.Capacitor,plugins=cap&&cap.Plugins,fs=plugins&&plugins.Filesystem,share=plugins&&plugins.Share;
  if(cap&&cap.isNativePlatform&&cap.isNativePlatform()&&fs&&share){
   const saved=await fs.writeFile({path:name,data:txt,directory:"DOCUMENTS",encoding:"utf8"});
   await share.share({title:"Copia GymLog",text:"Copia de seguridad de GymLog",url:saved.uri||saved.path,dialogTitle:"Guardar copia de GymLog"});mark();return;
  }
  const f=new File([txt],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Copia GymLog"});mark();return}
 }catch(e){if(e&&e.name==="AbortError")return;alert("No se pudo compartir la copia. Puedes probar «Copiar texto» o revisar los permisos de almacenamiento.");return}
 try{const url=URL.createObjectURL(new Blob([txt],{type:"application/json"}));const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);mark()}catch(e){alert("No se pudo descargar la copia. Prueba «Copiar texto».")}}
async function cpy(){try{await navigator.clipboard.writeText(JSON.stringify(S));mark();alert("Copiado. Pégalo en una nota o en un mensaje a ti mismo.")}catch(e){alert("No se pudo copiar. Usa Guardar copia.")}}
function pas(){const t=prompt("Pega aquí el texto de tu copia");if(t)load(t)}
function load(t){try{const d=JSON.parse(t);if(!d||typeof d!=="object"||Array.isArray(d)||!Array.isArray(d.machines)||!Array.isArray(d.routine)||!Array.isArray(d.logs))throw new Error("formato");
 if(d.machines.some(m=>typeof m!=="string"||!m.trim()||m.length>120)||d.routine.length>7||d.logs.length>100000)throw new Error("datos");
 const next=normalizeState(d);if(!confirm("Esto reemplaza tus datos actuales. ¿Continuar?"))return;S=next;Object.keys(drafts).forEach(k=>delete drafts[k]);if(!save())return;render();alert("Copia restaurada correctamente")}catch(e){alert("La copia no es válida o está incompleta. No se han cambiado tus datos.")}}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(f);el.value=""}
render();
let renderedDay=key();
function refreshDay(){const now=key();if(now!==renderedDay){renderedDay=now;extra=[];Object.keys(drafts).forEach(k=>delete drafts[k]);if(v==="hoy")render()}}
setInterval(refreshDay,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshDay()});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
